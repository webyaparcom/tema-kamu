<header class="modulex-skm{{skmsinif}}" role="banner">
  <div class="modulex-skm-ust">
    <div class="modulex-skm-ust-ic">
      <a class="modulex-skm-logo" href="/{{lang}}/" aria-label="@home@ - {{web-name}}">
        <img src="/img/{{logo}}" alt="{{web-name}}" loading="eager" decoding="async" />
      </a>
      <div class="modulex-skm-uc">
        <div class="modulex-skm-iletisim">{{skmiletisim}}</div>
        <div class="modulex-skm-dil">{{langbar}}</div>
      </div>
    </div>
  </div>
  <div class="modulex-skm-serit">
    <nav class="modulex-skm-nav" aria-label="@navigation@">
      <ul class="modulex-skm-liste">{{skmsekme}}</ul>
    </nav>
  </div>
</header>

<style>
  /* menu-sekme — klasör sekmeleri (15 Kas 2026, G3). Üst satır: logo + iletişim + dil. Alt: vurgu renkli şerit; öğeler üst köşeleri
     yuvarlak sekmeler, aktif sekme sayfa zemini rengindedir → altındaki içerikle birleşir (dosya sekmesi). Mobilde hamburger YOK:
     sekmeler yatay kaydırılır (scroll-snap, kenarda solma), aktif sekme görünür alana alınır.
     Renk çiftleri yalnız desing (var(--mx-site-*) varsayılanlı); mantıksal CSS → RTL'de sekme sırası ve solma yönü aynalanır. */
  .modulex-skm {
    position: relative;
    z-index: 40;
    box-sizing: border-box;
    width: 100%;
    background: --bg--;
    color: --text--;
  }
  .modulex-skm *,
  .modulex-skm *::before,
  .modulex-skm *::after { box-sizing: border-box; }
  .modulex-skm--sticky { position: sticky; inset-block-start: 0; }

  .modulex-skm-ust-ic {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    max-width: --max--;
    min-height: 76px;
    margin-inline: auto;
    padding-inline: 20px;
  }
  .modulex-skm-logo { display: inline-flex; align-items: center; flex-shrink: 0; min-height: 44px; }
  .modulex-skm-logo img {
    display: block;
    height: auto;
    width: auto;
    max-height: --logo_h--;
    max-width: 200px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .modulex-skm-logo img[src*=".svg"] { height: --logo_h--; width: auto; max-width: none; }
  .modulex-skm-uc { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .modulex-skm-iletisim { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .modulex-skm-iletisim:empty { display: none; }
  .modulex-skm .modulex-skm-bilgi {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding-inline: 10px;
    border-radius: 10px;
    color: --text--;
    font-size: 0.9rem;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.25s ease;
  }
  .modulex-skm .modulex-skm-bilgi .material-symbols-outlined { font-size: 20px; color: --kabuk--; }
  .modulex-skm .modulex-skm-bilgi:hover { background: color-mix(in srgb, --text-- 7%, transparent); }
  .modulex-skm .modulex-skm-bilgi:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .modulex-skm-dil { display: flex; align-items: center; color: --text--; }

  .modulex-skm-serit {
    background: --kabuk--;
    color: --kabukText--;
    padding-block-start: 10px;
  }
  .modulex-skm-nav {
    position: relative;
    max-width: --max--;
    margin-inline: auto;
    padding-inline: 12px;
  }
  .modulex-skm-liste {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .modulex-skm-liste::-webkit-scrollbar { display: none; }
  .modulex-skm-li { flex-shrink: 0; scroll-snap-align: start; }
  .modulex-skm .modulex-skm-sekme {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 46px;
    padding-inline: 20px;
    border-radius: --yuvarlak-- --yuvarlak-- 0 0;
    background: color-mix(in srgb, --kabukText-- 14%, transparent);
    color: --kabukText-- !important;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transform: translateY(4px);
    transition: transform 0.25s ease, background-color 0.25s ease;
  }
  .modulex-skm .modulex-skm-sekme:hover { transform: translateY(0); background: color-mix(in srgb, --kabukText-- 24%, transparent); }
  .modulex-skm .modulex-skm-sekme:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }
  .modulex-skm .modulex-skm-sekme[aria-current="page"] {
    transform: none;
    min-height: 50px;
    background: --sayfa--;
    color: --sayfaText-- !important;
    font-weight: 700;
  }
  /* aktif sekmenin alt köşelerinde ters yuvarlak «ayak» — sekme sayfaya akar */
  .modulex-skm .modulex-skm-sekme[aria-current="page"]::before,
  .modulex-skm .modulex-skm-sekme[aria-current="page"]::after {
    content: "";
    position: absolute;
    inset-block-end: 0;
    width: --yuvarlak--;
    height: --yuvarlak--;
    pointer-events: none;
  }
  /* başlangıç ayağı: kesik dış üst köşede (LTR sol üst · RTL sağ üst); bitiş ayağı tersi */
  .modulex-skm .modulex-skm-sekme[aria-current="page"]::before {
    inset-inline-end: 100%;
    background: radial-gradient(circle at 0 0, transparent calc(--yuvarlak-- - 0.5px), --sayfa-- --yuvarlak--);
  }
  .modulex-skm .modulex-skm-sekme[aria-current="page"]::after {
    inset-inline-start: 100%;
    background: radial-gradient(circle at 100% 0, transparent calc(--yuvarlak-- - 0.5px), --sayfa-- --yuvarlak--);
  }
  [dir="rtl"] .modulex-skm .modulex-skm-sekme[aria-current="page"]::before { background: radial-gradient(circle at 100% 0, transparent calc(--yuvarlak-- - 0.5px), --sayfa-- --yuvarlak--); }
  [dir="rtl"] .modulex-skm .modulex-skm-sekme[aria-current="page"]::after { background: radial-gradient(circle at 0 0, transparent calc(--yuvarlak-- - 0.5px), --sayfa-- --yuvarlak--); }
  .modulex-skm-li:first-child .modulex-skm-sekme[aria-current="page"]::before { display: none; }

  /* maske yalnız saydamlık okur — renk adı görünmez */
  .modulex-skm--tasiyor .modulex-skm-liste {
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 28px, black calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, black 28px, black calc(100% - 28px), transparent 100%);
  }

  @media (max-width: 1024px) {
    .modulex-skm-bilgi-yazi { display: none; }
    .modulex-skm .modulex-skm-bilgi { width: 44px; justify-content: center; padding-inline: 0; }
    .modulex-skm-uc { gap: 8px; }
  }
  @media (max-width: 768px) {
    .modulex-skm-ust-ic { min-height: 64px; padding-inline: 14px; }
    .modulex-skm-logo img { max-width: 140px; }
    .modulex-skm .modulex-skm-sekme { padding-inline: 16px; min-height: 44px; font-size: 0.9rem; }
    .modulex-skm .modulex-skm-sekme[aria-current="page"] { min-height: 48px; }
  }
  @media (max-width: 420px) {
    .modulex-skm-iletisim .modulex-skm-bilgi + .modulex-skm-bilgi { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-skm * { transition: none !important; animation: none !important; }
    .modulex-skm-liste { scroll-behavior: auto; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-skm");
    if (!kok || kok.dataset.skmHazir) return;
    kok.dataset.skmHazir = "1";
    const liste = kok.querySelector(".modulex-skm-liste");
    if (!liste) return;
    /* taşma varsa kenarlarda solma; aktif sekme görünür alana (yalnız yatay — sayfa dikeyde kaymaz; RTL tarayıcıda) */
    const olc = () => kok.classList.toggle("modulex-skm--tasiyor", liste.scrollWidth > liste.clientWidth + 2);
    const aktif = liste.querySelector('[aria-current="page"]');
    if (aktif && liste.scrollWidth > liste.clientWidth) {
      const l = liste.getBoundingClientRect();
      const a = aktif.getBoundingClientRect();
      liste.scrollLeft += (a.left + a.width / 2) - (l.left + l.width / 2);
    }
    olc();
    window.addEventListener("resize", () => requestAnimationFrame(olc), { passive: true });
  })();
</script>
